services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - campus-circle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../server
    restart: unless-stopped
    env_file:
      - ../server/.env.production
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - campus-circle-uploads:/var/lib/stardust-campus-circle/uploads
      - ${WECHATPAY_SECRET_DIR}:/run/secrets/wechatpay:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  campus-circle-postgres:
  campus-circle-uploads:
