<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>星尘校园圈 · 首页三概念</title>
<style>
/* ══════════════════════════════════════════════════════════════
   STARDUST CAMPUS CIRCLE — HOME CONCEPTS
   三个世界观：A 星夜星座 / B 编辑特辑 / C 柔光琉璃
   所有色值在 :root 声明为 token，概念内一律 var()/color-mix() 派生
══════════════════════════════════════════════════════════════ */
:root{
  /* brand genes */
  --brand:#28aee5;
  --brand-deep:#177ba8;
  --brand-hi:#7fd4f5;
  --navy:#0f2a40;
  --on-cyan:#04222e;
  --c-white:#ffffff;

  /* concept A · dark cosmos */
  --ca-bg-top:#10233a;
  --ca-bg-mid:#0a1626;
  --ca-bg-low:#060d16;

  /* concept B · editorial issue */
  --cb-paper:#f7f5ef;
  --cb-ink:#1b1813;

  /* concept C · ambient glass */
  --cc-bg:#edf4fa;
  --cc-ink:#0f2334;

  /* board chrome */
  --board-bg:#e6ecf2;
  --board-ink:#12202c;
  --board-line:color-mix(in srgb,var(--board-ink) 12%,transparent);
  --board-mut:color-mix(in srgb,var(--board-ink) 58%,var(--board-bg));

  /* hardware */
  --bezel-hi:#2a2c30; --bezel-mid:#191b1e; --bezel-lo:#0d0e10; --island:#000000;

  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text","Helvetica Neue","Noto Sans SC",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,"PingFang SC",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--board-bg);color:var(--board-ink);-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1480px;margin:0 auto;padding:0 40px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

/* board chrome */
.board-head{padding:64px 0 34px;border-bottom:1px solid var(--board-line)}
.head-eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--board-mut)}
.board-title{font-size:52px;font-weight:900;letter-spacing:-.02em;line-height:1.06;margin-top:14px}
.board-sub{max-width:640px;color:var(--board-mut);font-size:17px;margin-top:16px;line-height:1.65}
.head-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hchip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--board-line);background:color-mix(in srgb,var(--c-white) 55%,transparent);font-size:14px;font-weight:600;color:color-mix(in srgb,var(--board-ink) 72%,var(--board-bg))}

.concepts{display:flex;flex-wrap:wrap;gap:48px 40px;padding:60px 0 20px}
.shot{display:flex;flex-direction:column;gap:18px}
.concept-cap{display:flex;gap:16px;padding:0 6px;max-width:414px}
.cap-letter{
  flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
  background:var(--board-ink);color:var(--board-bg);font-size:26px;font-weight:900;letter-spacing:-.02em;
}
.cap-name{font-size:21px;font-weight:900;letter-spacing:-.01em}
.cap-name .cap-en{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--board-mut);text-transform:uppercase;margin-left:8px}
.cap-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.cap-chips span{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--board-line);color:var(--board-mut)}
.cap-note{font-size:13.5px;color:var(--board-mut);line-height:1.55;margin-top:9px}

/* device */
.device{position:relative;width:414px;height:868px;border-radius:56px;padding:12px;flex:none;
  background:linear-gradient(160deg,var(--bezel-hi) 0%,var(--bezel-mid) 52%,var(--bezel-lo) 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 0 0 2px var(--island) inset,
             0 34px 70px -24px rgba(6,14,22,.5),0 10px 24px -12px rgba(6,14,22,.36);}
.device::before,.device::after{content:"";position:absolute;width:3px;top:110px;bottom:110px;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.07) 10%,transparent 20%,transparent 82%,rgba(255,255,255,.05) 92%,transparent);}
.device::before{left:-1px}.device::after{right:-1px}
.island{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:var(--island);border-radius:999px;z-index:6}
.screen{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.statusbar{flex:0 0 50px;padding:16px 28px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:15px;font-weight:600;color:var(--fg);letter-spacing:-.01em;position:relative;z-index:3}
.statusbar .s{display:inline-flex;align-items:center;gap:6px}
.statusbar svg{width:17px;height:11px;fill:var(--fg)}
.statusbar .bat{width:25px}
.content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;z-index:2}
.content::-webkit-scrollbar{display:none}
.home-ind{flex:0 0 24px;position:relative;z-index:3}
.home-ind::after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:132px;height:5px;border-radius:999px;background:var(--fg);opacity:.86}

/* ── shared in-screen primitives（由各概念注入变量） ── */
.k-pad{padding:0 20px}
.k-eyebrow{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--fg3)}
.k-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--chip-bg);border:1px solid var(--br);color:var(--fg2);font-size:13.5px;font-weight:600;letter-spacing:.01em}
.k-chip .ic{width:13px;height:13px}
.k-card{background:var(--card);border:1px solid var(--br);border-radius:var(--kr);backdrop-filter:var(--kb,none);-webkit-backdrop-filter:var(--kb,none);box-shadow:var(--kshadow,none)}
.k-tile{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--tile-bg);color:var(--tile-fg);border:var(--tile-br,none)}
.k-tile .ic{width:22px;height:22px}
.k-mini{font-size:13px;color:var(--fg3);line-height:1.4}
.k-meta{font-size:15px;color:var(--fg2)}
.k-tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 10px 2px;background:var(--tab-bg);border-top:1px solid var(--tab-br);backdrop-filter:var(--tab-blur,none);-webkit-backdrop-filter:var(--tab-blur,none);position:relative;z-index:3}
.k-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;color:var(--fg3)}
.k-tab .ic{width:23px;height:23px}
.k-tab span{font-size:12px;font-weight:600;letter-spacing:.04em}
.k-tab.active{color:var(--tab-act)}
.k-fab{position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:0;z-index:9;cursor:pointer}
.k-fab .ic{width:24px;height:24px}
.bento{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.bento .big{grid-row:1/3}
.mini-card{padding:13px 15px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.mini-card .top{display:flex;align-items:center;justify-content:space-between}
.mini-card .top .ic{width:19px;height:19px;color:var(--fg3)}
.mini-card .val{font-size:23px;font-weight:900;letter-spacing:-.01em;color:var(--fg)}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{display:flex;align-items:center;gap:12px;padding:14px}
.svc .name{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:var(--fg)}
.svc .desc{font-size:13px;color:var(--fg3);margin-top:2px}
.bell-btn{width:44px;height:44px;flex:none;border-radius:999px;display:grid;place-items:center;background:var(--chip-bg);border:1px solid var(--br);color:var(--fg);cursor:pointer}
.bell-btn .ic{width:19px;height:19px}

/* ══════════════ 概念 A · 星夜星座 Dark Cosmos ══════════════ */
.ca{
  --fg:#eef6fc;
  --fg2:color-mix(in srgb,#eef6fc 66%,transparent);
  --fg3:color-mix(in srgb,#eef6fc 42%,transparent);
  --card:color-mix(in srgb,var(--c-white) 7%,transparent);
  --br:color-mix(in srgb,var(--c-white) 13%,transparent);
  --kr:20px;
  --kb:blur(12px);
  --kshadow:none;
  --chip-bg:color-mix(in srgb,var(--c-white) 9%,transparent);
  --tile-bg:color-mix(in srgb,var(--brand) 22%,transparent);
  --tile-fg:var(--brand-hi);
  --tab-bg:color-mix(in srgb,var(--ca-bg-low) 82%,transparent);
  --tab-br:color-mix(in srgb,var(--c-white) 10%,transparent);
  --tab-blur:blur(14px);
  --tab-act:var(--brand-hi);
  background:linear-gradient(180deg,var(--ca-bg-top) 0%,var(--ca-bg-mid) 46%,var(--ca-bg-low) 100%);
}
.ca .stars{position:absolute;top:0;left:0;width:100%;height:320px;z-index:1;pointer-events:none}
.ca .moon-glow{position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:430px;height:280px;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--brand) 22%,transparent),transparent 72%)}
.ca .hero-next{
  background:linear-gradient(152deg,color-mix(in srgb,var(--brand) 32%,transparent),color-mix(in srgb,var(--brand) 8%,transparent) 58%),color-mix(in srgb,var(--c-white) 6%,transparent);
  border-color:color-mix(in srgb,var(--brand-hi) 42%,transparent);
  box-shadow:0 0 36px -8px color-mix(in srgb,var(--brand) 42%,transparent);
}
.ca .fab-a{background:radial-gradient(circle at 32% 30%,color-mix(in srgb,var(--brand-hi) 88%,var(--c-white)),var(--brand) 58%,color-mix(in srgb,var(--brand) 52%,var(--navy)));
  color:var(--on-cyan);
  box-shadow:0 0 0 7px color-mix(in srgb,var(--brand) 15%,transparent),0 14px 32px -6px color-mix(in srgb,var(--brand) 55%,transparent)}
.ca .k-tab.active{position:relative}
.ca .k-tab.active::after{content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--brand-hi);box-shadow:0 0 8px var(--brand-hi)}
.ca .count-chip{background:var(--brand);border-color:transparent;color:var(--on-cyan)}
.ca .avatar{background:linear-gradient(140deg,var(--brand),var(--navy))}

/* ══════════════ 概念 B · 编辑特辑 Editorial Issue ══════════════ */
.cb{
  --fg:var(--cb-ink);
  --fg2:color-mix(in srgb,var(--cb-ink) 64%,var(--cb-paper));
  --fg3:color-mix(in srgb,var(--cb-ink) 44%,var(--cb-paper));
  --card:transparent;
  --br:color-mix(in srgb,var(--cb-ink) 24%,transparent);
  --kr:2px;
  --kshadow:none;
  --chip-bg:transparent;
  --tile-bg:transparent;
  --tile-fg:var(--cb-ink);
  --tile-br:1px solid var(--br);
  --tab-bg:var(--cb-paper);
  --tab-br:color-mix(in srgb,var(--cb-ink) 55%,transparent);
  --tab-act:var(--cb-ink);
  background:var(--cb-paper);
}
.cb .vol-chip{border:1.5px solid var(--brand);color:var(--brand-deep);border-radius:2px;font-family:var(--font-mono);font-size:11.5px;font-weight:700;letter-spacing:.2em;padding:5px 10px;text-transform:uppercase}
.cb .school-b{font-size:60px;font-weight:900;letter-spacing:-.03em;line-height:1.04;color:var(--fg);margin-top:14px}
.cb .eng-b{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg3);margin-top:10px}
.cb .rule-b{height:1.5px;background:var(--fg);margin-top:16px;opacity:.85}
.cb .rule-thin{height:1px;background:var(--br)}
.cb .big-d{font-size:72px;font-weight:900;letter-spacing:-.04em;line-height:.9;color:var(--fg)}
.cb .d-stack{font-family:var(--font-mono);font-size:12px;line-height:1.55;letter-spacing:.16em;color:var(--fg2);text-transform:uppercase}
.cb .notice-strip{border-top:1px solid var(--br);border-bottom:1px solid var(--br);padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:600;color:var(--fg)}
.cb .notice-strip .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--fg3);text-transform:uppercase}
.cb .notice-strip .ic{width:15px;height:15px;color:var(--fg3);margin-left:auto}
.cb .issue-box{border:1.5px solid var(--fg)}
.cb .next-t{font-size:46px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--fg)}
.cb .tri{display:grid;grid-template-columns:1fr 1fr 1fr}
.cb .tri > div{padding:2px 14px}
.cb .tri > div + div{border-left:1px solid var(--br)}
.cb .tri .v{font-size:28px;font-weight:900;letter-spacing:-.02em;color:var(--fg)}
.cb .svc-grid-b{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--br)}
.cb .svc-b{padding:16px}
.cb .svc-b:nth-child(1),.cb .svc-b:nth-child(3){border-right:1px solid var(--br)}
.cb .svc-b:nth-child(1),.cb .svc-b:nth-child(2){border-bottom:1px solid var(--br)}
.cb .svc-b .no{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;color:var(--fg3)}
.cb .svc-b .ic{width:20px;height:20px;color:var(--fg)}
.cb .svc-b .name{font-size:19px;font-weight:900;color:var(--fg);margin-top:10px;letter-spacing:-.01em}
.cb .svc-b .desc{font-size:13.5px;color:var(--fg3);margin-top:3px}
.cb .entry-b{padding:14px 0;border-top:1px solid var(--br)}
.cb .entry-b .t{font-size:18px;font-weight:900;color:var(--fg);letter-spacing:-.01em;line-height:1.35}
.cb .entry-b .m{display:flex;align-items:center;gap:8px;margin-top:7px;font-family:var(--font-mono);font-size:12px;color:var(--fg3)}
.cb .entry-b .m .ic{width:14px;height:14px}
.cb .fab-b{background:var(--cb-ink);color:var(--cb-paper);border-radius:16px}
.cb .k-tab{position:relative}
.cb .k-tab.active::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--cb-ink)}
.cb .avatar{background:var(--cb-ink);color:var(--cb-paper)}
.cb .bell-btn{border-radius:2px}

/* ══════════════ 概念 C · 柔光琉璃 Ambient Glass ══════════════ */
.cc{
  --fg:var(--cc-ink);
  --fg2:color-mix(in srgb,var(--cc-ink) 68%,var(--cc-bg));
  --fg3:color-mix(in srgb,var(--cc-ink) 46%,var(--cc-bg));
  --card:color-mix(in srgb,var(--c-white) 62%,transparent);
  --br:color-mix(in srgb,var(--c-white) 75%,transparent);
  --kr:24px;
  --kb:blur(16px) saturate(1.15);
  --kshadow:0 18px 40px -26px color-mix(in srgb,var(--navy) 48%,transparent);
  --chip-bg:color-mix(in srgb,var(--c-white) 60%,transparent);
  --tile-bg:linear-gradient(140deg,color-mix(in srgb,var(--brand) 30%,var(--c-white)),color-mix(in srgb,var(--brand) 12%,var(--c-white)));
  --tile-fg:var(--brand-deep);
  --tab-bg:color-mix(in srgb,var(--c-white) 58%,transparent);
  --tab-br:color-mix(in srgb,var(--c-white) 70%,transparent);
  --tab-blur:blur(16px);
  --tab-act:var(--brand-deep);
  background:var(--cc-bg);
}
.cc .aurora{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(42% 30% at 16% 4%,color-mix(in srgb,var(--brand) 30%,transparent),transparent 72%),
    radial-gradient(38% 26% at 88% 8%,color-mix(in srgb,var(--navy) 17%,transparent),transparent 74%),
    radial-gradient(30% 22% at 74% 44%,color-mix(in srgb,var(--brand) 13%,transparent),transparent 70%)}
.cc .school-c{background:linear-gradient(115deg,var(--brand-deep),var(--navy) 74%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc .hero-next{
  background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 30%,var(--c-white)),color-mix(in srgb,var(--c-white) 58%,transparent) 60%),color-mix(in srgb,var(--c-white) 44%,transparent);
  border-color:color-mix(in srgb,var(--c-white) 82%,transparent);
  box-shadow:0 22px 46px -24px color-mix(in srgb,var(--brand) 52%,transparent);
}
.cc .fab-c{background:radial-gradient(circle at 30% 28%,color-mix(in srgb,var(--c-white) 96%,transparent),color-mix(in srgb,var(--brand-hi) 78%,transparent) 48%,color-mix(in srgb,var(--brand) 90%,transparent));
  color:var(--c-white);
  box-shadow:0 0 0 6px color-mix(in srgb,var(--c-white) 55%,transparent),0 16px 34px -8px color-mix(in srgb,var(--brand) 52%,transparent)}
.cc .count-chip{background:var(--brand-deep);border-color:transparent;color:var(--c-white)}
.cc .avatar{background:linear-gradient(140deg,var(--brand-hi),var(--brand-deep))}
.cc .k-tab.active{position:relative}
.cc .k-tab.active::before{content:"";position:absolute;inset:4px 8px;border-radius:14px;background:color-mix(in srgb,var(--brand) 14%,transparent);z-index:-1}

/* shared bits */
.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--c-white)}
.post-row{display:flex;gap:12px;padding:15px 16px}
.board-foot{padding:56px 0 64px;text-align:center;color:var(--board-mut);font-size:14px;line-height:1.9}
.board-foot .head-eyebrow{display:block;margin-bottom:8px}
@media (max-width:900px){.wrap{padding:0 20px}.board-title{font-size:38px}}
</style>
</head>

<!-- 图标库：统一线性 / 圆角端点 / 1.7 stroke -->

  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5.2a4 4 0 0 1-8 0V4z"/><path d="M8 5.2H5a3 3 0 0 0 3.2 3.6"/><path d="M16 5.2h3a3 3 0 0 1-3.2 3.6"/><path d="M12 13.4v3"/><path d="M8.2 20h7.6"/><path d="M9.6 16.4h4.8l.6 3.6H9l.6-3.6z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.7 3.7-5.6 7-5.6s6.2 1.9 7 5.6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.2 9.4a5.8 5.8 0 0 1 11.6 0c0 4.6 1.8 5.7 1.8 5.7H4.4s1.8-1.1 1.8-5.7z"/><path d="M10.4 18.8a1.9 1.9 0 0 0 3.2 0"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.4 5.6 6.4 6.4-6.4 6.4"/></symbol>
