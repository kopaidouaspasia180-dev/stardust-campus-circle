server {
    server_name stardust.sale www.stardust.sale;

    client_max_body_size 25m;

    location = /campus-circle {
        return 301 /campus-circle/;
    }

    location ^~ /campus-circle/ {
        alias /var/www/stardust-campus-circle/;
        index index.html;
        try_files $uri $uri/ /campus-circle/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /by27vZulWB.txt {
        alias /var/www/stardust-kebike/by27vZulWB.txt;
