    # BEGIN stardust-sub2api
    location = /sub2api {
        return 301 /sub2api/;
    }

    # Dynamic Sub2API backend and gateway endpoints. The public prefix is
    # stripped before forwarding to the loopback-only application service.
    location ~ ^/sub2api/(api|v1|v1beta|responses|backend-api|chat|embeddings|images|videos|alpha|models|antigravity|sora|health|setup)(/|$) {
        rewrite ^/sub2api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sub2api;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 256m;
        proxy_redirect ~^(/.*)$ /sub2api$1;
        proxy_cookie_path / /sub2api/;
    }

    location /sub2api/ {
        alias /var/www/stardust-sub2api/frontend/;
        index index.html;
        try_files $uri $uri/ /sub2api/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    # END stardust-sub2api

    # BEGIN stardust-campus-ai
    # Next.js is built with basePath=/campus-ai, so the prefix is preserved.
    location = /campus-ai {
        include /etc/nginx/snippets/stardust-campus-ai-proxy.conf;
        client_max_body_size 8m;
    }

    location = /campus-ai/api/auth/login {
        limit_except POST { deny all; }
        limit_req zone=campus_login burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/stardust-campus-ai-proxy.conf;
        client_max_body_size 64k;
    }

    location = /campus-ai/api/auth/register {
        limit_except POST { deny all; }
        limit_req zone=campus_register burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/stardust-campus-ai-proxy.conf;
        client_max_body_size 64k;
    }

    location = /campus-ai/api/account/redeem {
        limit_except POST { deny all; }
        limit_req zone=campus_redeem burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/stardust-campus-ai-proxy.conf;
        client_max_body_size 64k;
    }

    location = /campus-ai/api/admin/action {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/stardust-campus-ai-proxy.conf;
        client_max_body_size 128k;
    }

    location ^~ /campus-ai/ {
        if ($campus_ai_blocked_request) { return 404; }
        limit_except GET HEAD POST { deny all; }
        include /etc/nginx/snippets/stardust-campus-ai-proxy.conf;
        client_max_body_size 8m;
    }
    # END stardust-campus-ai


